[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "net-config-auditor"
version = "0.1.0"
description = "SSH config backup and golden-config compliance auditing for network devices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "netmiko>=4.3.0",
    "PyYAML>=6.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[project.scripts]
net-config-auditor = "netauditor.cli:run_cli"

[tool.setuptools]
packages = ["netauditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
