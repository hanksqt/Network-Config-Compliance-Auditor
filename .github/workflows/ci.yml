# Unit tests only — no devices are contacted here.
#
# The scheduled compliance run against real devices lands in Phase 5 as a
# separate workflow, because it needs repository secrets and a reachable lab.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Check inventory.yaml and golden.yaml parse
        # Catches a broken config file before it reaches a scheduled run.
        # No credentials: neither command opens a socket, and requiring
        # secrets for an offline operation would be a design smell.
        run: |
          python auditor.py --list-devices --no-color
          python auditor.py --check --no-color || true
